# ===========================================================================
# Trazza — stack de PRODUCCIÓN
# Consume imágenes pre-buildeadas desde GHCR (ver .github/workflows/build.yml).
# Expone SOLO los puertos de Web y API (+MinIO/MQTT opcionales) para que tu
# Nginx Proxy Manager (NPM) los proxee con TLS. No incluye reverse proxy propio.
#
#   Deploy:  docker compose pull && docker compose up -d
# ===========================================================================

name: trazza

x-restart: &restart
  restart: unless-stopped

services:
  db:
    image: timescale/timescaledb-ha:pg16
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - db-data:/home/postgres/pgdata/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [trazza]

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [trazza]

  mqtt:
    image: eclipse-mosquitto:2
    <<: *restart
    volumes:
      - ./infra/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    ports:
      - "${MQTT_PORT:-1883}:1883"
    networks: [trazza]

  minio:
    # MinIO retiró sus imágenes de Docker Hub (oct. 2025); la oficial vive en quay.io.
    image: quay.io/minio/minio:latest
    <<: *restart
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9090}:9001"
    # Sin healthcheck: nada depende de MinIO y evitamos suponer qué binarios
    # (curl/mc) trae la imagen. El endpoint /minio/health/live queda para NPM.
    networks: [trazza]

  api:
    image: ${IMAGE_REPO}/trazza-api:${IMAGE_TAG:-latest}
    <<: *restart
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      INGEST_TOKEN: ${INGEST_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Expuesto para dispositivos / apps móviles vía NPM (api.tudominio.com)
      - "${API_PORT:-8091}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [trazza]

  web:
    image: ${IMAGE_REPO}/trazza-web:${IMAGE_TAG:-latest}
    <<: *restart
    depends_on:
      - api
    ports:
      # Frontend + landing vía NPM (app.tudominio.com). nginx proxea /api -> api:8080
      - "${WEB_PORT:-8090}:8080"
    networks: [trazza]

  traccar:
    # Servidor de tracking GPS: recibe los protocolos binarios de los rastreadores
    # (Teltonika/Queclink/Concox...) y reenvía cada posición a la API POR LA RED
    # INTERNA de Docker (http://api:8080/adapters/traccar). Toda la config va por
    # variables de entorno (CONFIG_USE_ENVIRONMENT_VARIABLES) — no monta archivos.
    image: ${TRACCAR_IMAGE:-traccar/traccar:latest}
    <<: *restart
    depends_on:
      - api
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      # Base embebida H2 persistida en el volumen (suficiente para una instancia).
      DATABASE_DRIVER: org.h2.Driver
      DATABASE_URL: jdbc:h2:./data/database
      DATABASE_USER: sa
      DATABASE_PASSWORD: ""
      # Reenvío de posiciones a Trazza (JSON) por la red interna del stack.
      # tenantId identifica al cliente; el token viaja en el header (no en la URL).
      FORWARD_ENABLE: "true"
      FORWARD_TYPE: json
      FORWARD_URL: http://api:8080/adapters/traccar?tenantId=${TRACCAR_TENANT_ID}
      FORWARD_HEADER: "X-Ingest-Token: ${INGEST_TOKEN}"
    volumes:
      - traccar-data:/opt/traccar/data
    ports:
      # UI de administración de Traccar: dar de alta cada rastreador por IMEI.
      # Proxealo por NPM (traccar.tudominio.com -> 8082) si querés TLS.
      - "${TRACCAR_PORT:-8082}:8082"
      # Puertos de protocolo: los rastreadores del campo se conectan acá por
      # internet. Abrí el rango en el firewall (podés acotarlo a los de tus equipos).
      - "5000-5150:5000-5150"
      - "5000-5150:5000-5150/udp"
    networks: [trazza]

volumes:
  db-data:
  redis-data:
  mqtt-data:
  minio-data:
  traccar-data:

networks:
  trazza:
    driver: bridge
